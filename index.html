<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<meta name="color-scheme" content="dark">
<meta name="description" content="A local-first daily execution system built around Floor, Standard and Full.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Discipline Ladder</title>
<style>
:root{--bg:#14171c;--panel:#1b1f26;--panel2:#20252d;--panel3:#171a20;--line:#303640;--line2:#3a414c;--text:#eeeae1;--muted:#9da5b1;--faint:#68707c;--gold:#d1aa2b;--gold2:#f0cf63;--teal:#54a89a;--teal2:#8bd0c3;--rust:#d36b50;--rust2:#ef9b83;--blue:#78a9d8;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--cond:Arial Narrow,Barlow,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{color-scheme:dark;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100dvh}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.wrap{width:min(1040px,100%);margin:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 56px)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}h1{font:700 40px/.98 var(--cond);margin:5px 0 4px}.sub{font-size:11px;color:var(--muted);line-height:1.5}.iconbtn{width:44px;height:44px;border:1px solid var(--line);background:var(--panel);border-radius:9px;font-size:18px}
.targetbar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.target{min-height:70px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px;text-align:left}.target b{display:block;font:700 18px var(--cond)}.target span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.target .count{font-size:11px;color:var(--text);margin-top:5px}.target.active{border-color:var(--gold);background:#25200e}.target.active b{color:var(--gold2)}.target.met .count{color:var(--teal2)}
.commitbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--panel3);border:1px solid var(--line);border-radius:9px;margin-bottom:14px}.commitbar .label{font-size:11px;color:var(--muted);margin-right:auto}.commitbar .label b{color:var(--text)}.pill{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:4px 8px;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.locknote{width:100%;font-size:9px;color:var(--faint)}
.grid{display:grid;gap:14px}.maincol,.sidecol{min-width:0}.hero{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:16px;margin-bottom:12px}.hero.now{border-left-color:var(--teal)}.hero.late{border-left-color:var(--rust)}.hero.done{border-left-color:var(--teal)}.hero.over{border-left-color:var(--rust)}.hero .kick{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--gold)}.hero.now .kick,.hero.done .kick{color:var(--teal2)}.hero.late .kick,.hero.over .kick{color:var(--rust2)}.hero h2{font:700 28px/1.08 var(--cond);margin:5px 0}.hero .time{font-size:11px;color:var(--muted)}.hero .meta{font-size:10px;color:var(--muted);margin-top:8px}.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.btn{min-height:44px;border-radius:7px;border:1px solid var(--line2);background:transparent;padding:9px 12px}.btn.primary{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:800}.btn.ghost{color:var(--gold2);border-color:#7e6820}.btn.small{min-height:36px;font-size:11px;padding:7px 10px}.btn.danger{border-color:#6e4035;color:var(--rust2)}.btn:disabled{opacity:.42;cursor:not-allowed}.focusHint{margin-top:10px;font-size:10px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:14px}.panel-title{display:flex;align-items:baseline;gap:8px;font:700 17px var(--cond);text-transform:uppercase;margin-bottom:9px}.panel-title small{font:400 9px var(--mono);color:var(--faint);text-transform:none;margin-left:auto}.progressbar{height:8px;background:#252b32;border-radius:999px;overflow:hidden}.progressbar>i{display:block;height:100%;background:var(--teal);border-radius:inherit}.statline{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:10px;color:var(--muted)}.statline b{color:var(--text)}.risk{margin-top:10px;padding:9px 10px;border:1px solid #604037;border-radius:7px;color:var(--rust2);font-size:10px;line-height:1.5}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:13px}.daycell{border:1px solid var(--line);border-radius:7px;background:var(--panel3);padding:6px 3px;text-align:center;cursor:pointer}.daycell.today{border-color:var(--gold);background:#211d0e}.daycell.future{opacity:.45}.daycell .dow{font-size:8px;color:var(--muted)}.daycell.today .dow{color:var(--gold2)}.ladder{height:32px;display:flex;flex-direction:column-reverse;gap:2px;margin-bottom:4px}.ladder i{height:8px;border:1px solid var(--line2);border-radius:2px}.ladder[data-level="1"] i:nth-child(-n+1),.ladder[data-level="2"] i:nth-child(-n+2),.ladder[data-level="3"] i:nth-child(-n+3){background:var(--teal);border-color:var(--teal)}.daycell.skipped .ladder i{border-color:#6f4c43}.daycell.missed .ladder i{border-color:var(--rust)}.daycell.adjusted{box-shadow:inset 0 -2px 0 var(--gold)}
.section{margin:0 0 17px}.section-head{display:flex;align-items:baseline;gap:7px;padding:0 3px 7px;border-bottom:1px dashed var(--line)}.section-head h2{font:700 18px var(--cond);text-transform:uppercase;margin:0}.section-head .range{margin-left:auto;font-size:9px;color:var(--muted)}.section-head .prog{font-size:10px;color:var(--muted)}.section-head .prog.full{color:var(--teal2)}.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto 32px;gap:8px;align-items:center;width:100%;min-height:56px;padding:7px 2px;background:transparent;border:0;border-radius:7px;text-align:left}.task:hover{background:var(--panel2)}.task.upcoming{opacity:.72}.task.stretch{opacity:.55}.task .box{width:23px;height:23px;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center;color:transparent;font-size:13px;background:transparent}.task[data-status="done"] .box{background:var(--teal);border-color:var(--teal);color:var(--bg)}.task[data-status="skipped"] .box{border-color:#8d604f;color:#d9a08f}.task[data-status="missed"] .box{border-color:var(--rust);color:var(--rust)}.task[data-status="done"] .name{text-decoration:line-through;color:var(--muted)}.task .name{font-size:12px;line-height:1.25;min-width:0}.task .name span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task .time{font-size:9px;color:var(--muted);white-space:nowrap}.more{width:32px;height:32px;border:1px solid var(--line);background:transparent;border-radius:6px;color:var(--muted)}.more:disabled{opacity:.3}.anchor{display:flex;justify-content:space-between;gap:8px;padding:7px 3px 7px 36px;color:var(--faint);font-size:9px}.stretchLabel{font-size:9px;color:var(--faint);margin-left:36px;margin-top:-2px;margin-bottom:3px}
.details{margin-bottom:14px}.details summary{list-style:none;cursor:pointer;padding:13px 14px;font:700 16px var(--cond);text-transform:uppercase;background:var(--panel);border:1px solid var(--line);border-radius:9px}.details summary::-webkit-details-marker{display:none}.details summary:after{content:'＋';float:right;color:var(--muted)}.details[open] summary:after{content:'−'}.reviewbody{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 9px 9px;padding:12px 14px}.reviewgrid{overflow:auto}.reviewgrid table{width:100%;border-collapse:collapse;font-size:9px}.reviewgrid th,.reviewgrid td{padding:6px 3px;text-align:center;border-bottom:1px solid #252a32}.reviewgrid th:first-child,.reviewgrid td:first-child{text-align:left;color:var(--muted);white-space:nowrap}.reviewstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.metric{background:var(--panel2);border-radius:7px;padding:9px}.metric span{display:block;font-size:9px;color:var(--muted)}.metric b{display:block;font:700 18px var(--cond);margin-top:2px}.leaks{margin-top:12px;font-size:10px;line-height:1.7}.leaks b{color:var(--text)}
.side-sticky{position:sticky;top:12px}.side-copy{font-size:10px;color:var(--muted);line-height:1.6}.side-copy b{color:var(--text)}.side-actions{display:grid;gap:7px}.footer{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:16px}.footer .btn{font-size:10px;min-height:40px}.ver{text-align:center;color:#59606b;font-size:9px;margin-top:11px}.install{display:none;border:1px solid var(--gold);background:#211d0e;border-radius:8px;padding:10px;margin-bottom:10px;justify-content:space-between;gap:8px;font-size:10px}.install.show{display:flex}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:30}.modal.open{display:flex}.sheet{width:min(720px,100%);max-height:92dvh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px 14px 8px 8px;padding:16px}.sheet h2{font:700 23px var(--cond);margin:0 0 5px}.sheet p{font-size:10px;color:var(--muted);line-height:1.55}.sheet .row{display:flex;gap:8px;align-items:center;margin:9px 0}.sheet label{font-size:10px;color:var(--muted);min-width:76px}.sheet input,.sheet select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px}.sheet .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.focus-time{font:700 52px var(--cond);text-align:center;color:var(--gold2);margin:15px 0}.focus-task{font:700 26px var(--cond);text-align:center}.focus-note{text-align:center;color:var(--muted);font-size:10px}.settings-section{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.settings-section h3{font:700 14px var(--cond);margin:0 0 8px;text-transform:uppercase}.routine-row{display:grid;grid-template-columns:minmax(120px,1fr) 72px 72px 76px 32px;gap:5px;align-items:center;margin:6px 0}.routine-row input,.routine-row select{font-size:9px;padding:7px}.routine-row button{height:32px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:#252a31;border:1px solid var(--line2);padding:10px 13px;border-radius:8px;font-size:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:min(92vw,520px);text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:820px){.grid{grid-template-columns:minmax(0,1.5fr) minmax(270px,.5fr)}.top{margin-bottom:17px}.maincol .hero{margin-bottom:14px}}
@media(max-width:560px){h1{font-size:35px}.target{min-height:67px}.target b{font-size:16px}.hero-actions{grid-template-columns:1fr}.task{grid-template-columns:28px minmax(0,1fr) 32px}.task .time{grid-column:2;font-size:8px;margin-top:-2px}.more{grid-column:3;grid-row:1/3}.reviewstats{grid-template-columns:1fr 1fr}.reviewstats .metric:last-child{grid-column:1/-1}.routine-row{grid-template-columns:1fr 62px 62px 64px 30px}.week{gap:3px}.daycell{padding:5px 2px}}
</style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>
<input id="importFile" type="file" accept="application/json" hidden>
<div id="modal" class="modal" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
